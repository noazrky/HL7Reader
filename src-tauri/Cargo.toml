[package]
name = "hl7-reader-tauri"
version = "2.1.3"
description = "Tauri desktop implementation of HL7 Reader"
authors = ["local"]
edition = "2021"
build = "build.rs"

[lib]
name = "hl7_reader_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
